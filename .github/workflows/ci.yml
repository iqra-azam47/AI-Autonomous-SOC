name: AI Autonomous SOC CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest & ML Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Verify ML Dataset & Artifact Generation
        run: |
          cd ml
          python dataset.py
          python train.py

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci_secret_key_testing_soc_2026_test_only
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build
